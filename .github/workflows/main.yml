name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Susun berkas proyek
        run: |
          # Berkas yang diunggah tanpa folder memakai "__" sebagai pengganti "/".
          # Contoh: app__src__main__AndroidManifest.xml -> app/src/main/AndroidManifest.xml
          # Buang berkas lama yang masih memakai nama paket lama (com/rifsy).
          rm -f *__rifsy__*
          for f in *__*; do
            [ -f "$f" ] || continue
            p="${f//__//}"
            mkdir -p "$(dirname "$p")"
            mv -f "$f" "$p"
            echo "disusun: $p"
          done
          rm -f build.gradle.kts build.gradle
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Unduh font Arab
        run: |
          # Font sumber terbuka (OFL) dari Google Fonts. Bila satu gagal, aplikasi tetap jalan.
          mkdir -p app/src/main/assets/fonts
          B=https://github.com/google/fonts/raw/main/ofl
          get() { curl -fsSL --retry 3 -o "app/src/main/assets/fonts/$2" "$B/$1" || { echo "GAGAL: $2"; rm -f "app/src/main/assets/fonts/$2"; }; }
          get amiri/Amiri-Regular.ttf Amiri-Regular.ttf
          get scheherazadenew/ScheherazadeNew-Regular.ttf ScheherazadeNew-Regular.ttf
          get "notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf" NotoNaskhArabic.ttf
          get lateef/Lateef-Regular.ttf Lateef-Regular.ttf
          get "notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf" NotoKufiArabic.ttf
          get "cairo/Cairo%5Bslnt%2Cwght%5D.ttf" Cairo.ttf
          ls -la app/src/main/assets/fonts

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "GAGAL: secret KEYSTORE_BASE64 belum dibuat di Settings > Secrets and variables > Actions."
            exit 1
          fi
          rm -f app/debaan.jks
          echo "$KEYSTORE_BASE64" | base64 -d > app/debaan.jks
          test -s app/debaan.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} -PgithubRepo=${{ github.repository }} --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Debaan-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Debaan v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Debaan-v1.0.${{ github.run_number }}.apk
